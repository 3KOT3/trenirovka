plugins {
    id 'java'
    id("io.qameta.allure") version "4.3.0"
    id("io.freefair.lombok") version "9.8.2"
}

def allureVersion = "2.32.0"

allure {
    report {
        version.set(allureVersion)
    }
    adapter {
        aspectjWeaver.set(true)
        frameworks {
            junit5 {
                adapterVersion.set(allureVersion)
            }
        }
    }
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.codeborne:selenide:7.18.2'
    testImplementation 'com.github.javafaker:javafaker:1.0.2'
    testImplementation "io.qameta.allure:allure-junit5:${allureVersion}"
    testImplementation "io.qameta.allure:allure-selenide:${allureVersion}"
    testImplementation "io.qameta.allure:allure-rest-assured:${allureVersion}"
    testImplementation "io.qameta.allure:allure-assertj:${allureVersion}"
    testImplementation 'org.aeonbits.owner:owner:1.0.12'
    testImplementation 'io.rest-assured:rest-assured:5.5.6'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    testImplementation 'org.assertj:assertj-core:3.27.7'
}

test {
    systemProperty "run", System.getProperty("run", "local")
    useJUnitPlatform()
}

task uiTest(type: Test) {
    def tag = System.getProperty("tag")

    if (tag != null && !tag.isBlank()) {
        useJUnitPlatform {
            includeTags "UI & $tag"
        }
    } else {
        useJUnitPlatform {
            includeTags "UI"
        }
    }
}

task apiTest(type: Test) {
    def tag = System.getProperty("tag")

    if (tag != null && !tag.isBlank()) {
        useJUnitPlatform {
            includeTags "API & $tag"
        }
    } else {
        useJUnitPlatform {
            includeTags "API"
        }
    }
}